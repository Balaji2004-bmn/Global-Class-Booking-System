spring:
  application:
    name: global-class-booking-system
  datasource:
    url: jdbc:postgresql://localhost:5432/class_booking
    username: booking_app
    password: booking_app
    driver-class-name: org.postgresql.Driver
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  sql:
    init:
      mode: always

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    org.hibernate.SQL: warn

